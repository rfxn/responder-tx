# Standalone Worker that hosts the ShareLinks Durable Object for board short links (/s/<code>).
# Deploy separately from the Pages site:  cd workers/share-links && npx -y wrangler@3.114.0 deploy
# The Pages project (responder-tx) binds to this DO via a `SHARE` Durable Object binding with
# script_name = "responder-share-links" (see README.md). This file does NOT affect `wrangler pages deploy`.

name = "responder-share-links"
main = "share-links.js"
compatibility_date = "2025-06-01"

# Not publicly routable: the DO is reached only through the Pages SHARE binding.
workers_dev = false

[[durable_objects.bindings]]
name = "SHARE"
class_name = "ShareLinks"

# SQLite-backed DO class: available on the Workers free plan (no paid entitlement required).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareLinks"]
