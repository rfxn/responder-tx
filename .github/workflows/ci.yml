name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue lean.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check app scripts (js/*.js, excl. vendor)
        run: |
          for f in js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      # One entry point on purpose. This used to be a step per suite, and the hand-kept list
      # drifted: four python suites existed and were named nowhere, so 114 checks ran in no CI
      # job at all. tests/run.sh enumerates tests/*.test.sh and tests/*.test.py from disk, keeps
      # going after a suite goes red (what the old per-step !cancelled() bought), and prints the
      # failing test names at the end.
      - name: Test suites (node + shell + python)
        if: ${{ !cancelled() }}
        run: bash tests/run.sh

      - name: Release-cycle sanity checks
        if: ${{ !cancelled() }}
        run: bash scripts/cycle-check.sh
